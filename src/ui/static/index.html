<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorkHelper 工作秘书</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <span class="brand">工作秘书</span>
    <nav class="tabs" id="tabs">
      <button data-tab="inbox">收件箱<span class="badge zero" id="badge-inbox">0</span></button>
      <!-- 「全部」是可见性约束的落点（需求 §6.6 / F-09）：
           任何未结束任务都必须能在这里找到，包括既无截止日期也无项目的那些 -->
      <button data-tab="all">全部<span class="badge zero" id="badge-open">0</span></button>
      <button data-tab="today">今日</button>
      <button data-tab="projects">项目</button>
      <button data-tab="log">日志</button>
    </nav>
    <div class="search-box">
      <input type="search" id="search" placeholder="搜索（中文子串可用）" autocomplete="off">
      <button id="quick-capture" title="打开快记窗">＋ 快记</button>
    </div>
  </header>

  <!-- 焦点常驻条（需求 F-15b / F-15c）：被打断后回来，一眼看到"我刚才在做哪件"。
       它同时是「记一笔」的入口 —— 聚焦之后记进展不需要先找到任务。
       Ctrl+Shift+Space 会把光标直接送到这里的输入框。 -->
  <div class="focus-bar" id="focus-bar"></div>

  <main id="view"></main>

  <!-- 带版本参数：换了版本号浏览器就会重新拉取，即使此前缓存过。
       服务端同时发送 no-cache，两者叠加确保改完前端必定生效。 -->
  <script type="module" src="/app.js?v=0.3.0"></script>
</body>
</html>
