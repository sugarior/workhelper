[package]
name = "workhelper-shell"
version = "0.2.0"
edition = "2021"
description = "工作秘书的桌面外壳：拉起 Node 内核、注册全局热键、承载界面"
# 外壳是二进制 crate，不对外暴露库接口
publish = false

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# 两个 feature 都是**必须显式开启的**：
#   · `tray-icon` —— 需求 F-16 的系统托盘。不开的话 `TrayIconBuilder` 根本不存在。
#   · `image-png` —— 托盘图标是 PNG，`Image::from_bytes` 需要它才能解码。
# 不开的后果都是**编译期就报找不到**，因此不存在"忘了开却静默不工作"的风险。
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
# 全局快捷键（实验 B2-b 用）
tauri-plugin-global-shortcut = "2.4.0"
# 在 PATH 里找 node。自己解析 PATH 要处理 .exe/.cmd、PATHEXT、大小写等一堆细节，
# 而这个 crate 足够小且只做这一件事。
which = "8.0.6"
# 设置接口要在 Rust 与页面之间传结构化数据（`get_shell_settings` 返回一个对象）。
# tauri 内部依赖它，但**直接 `use` 就必须显式声明** —— 否则哪天 tauri 换了
# 内部依赖，编译会突然失败而看不出原因。
serde_json = "1"

# 只发 release 的 strip，减小体积
[profile.release]
strip = true
lto = true
codegen-units = 1
